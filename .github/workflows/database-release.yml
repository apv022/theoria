name: Supabase migration release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment containing the intended Supabase project secrets
        required: true
        type: choice
        options: [staging, production]
      apply:
        description: Apply reviewed pending migrations after the dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify and migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Require protected project configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Link the selected project
        run: corepack pnpm supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Show migration history
        run: corepack pnpm supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Review pending SQL
        run: corepack pnpm supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply reviewed migrations
        if: inputs.apply
        run: corepack pnpm supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Prove no migrations remain pending
        if: inputs.apply
        run: |
          corepack pnpm supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          output="$(corepack pnpm supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run)"
          echo "$output"
          echo "$output" | grep -F "Remote database is up to date."
